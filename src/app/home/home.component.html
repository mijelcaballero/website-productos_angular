<div class="section-header">
  <h2>🎬 Películas en Cartelera</h2>
</div>

<div *ngIf="!loading && peliculasEnCartelera.length > 0" id="carouselPeliculas" class="carousel slide carousel-home mx-auto" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div
      *ngFor="let pelicula of peliculasEnCartelera; let i = index"
      class="carousel-item"
      [class.active]="i === 0"
    >
      <img 
        [src]="pelicula.imagenUrl" 
        class="img-carousel d-block mx-auto" 
        [alt]="pelicula.titulo" 
        (click)="verDetalles(pelicula.id)"
      >
      <div class="carousel-caption-custom">
        <h5 (click)="verDetalles(pelicula.id)" style="cursor: pointer;">{{ pelicula.titulo }}</h5>
        <p>{{ pelicula.descripcion }}</p>
        <small>Estreno: {{ formatFechaEstreno(pelicula.fechaEstreno) }}</small>
      </div>
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselPeliculas" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselPeliculas" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
  </button>
</div>

<div class="section-header">
  <h2>📅 Próximos Estrenos</h2>
</div>

<div class="row row-cols-1 row-cols-md-4 g-4 mb-5">
  <div class="col" *ngFor="let pelicula of proximosEstrenos">
    <div class="card h-100 shadow-sm border-0">
      <img [src]="pelicula.imagenUrl" class="card-img-top" alt="{{ pelicula.titulo }}">
      <div class="card-body">
        <h5 class="card-title">{{ pelicula.titulo }}</h5>
        <p class="card-text">{{ pelicula.descripcion }}</p>
        <span class="badge bg-warning text-dark">🎬 Estreno: {{ formatFechaEstreno(pelicula.fechaEstreno) }}</span>
      </div>
    </div>
  </div>
</div>
